# This docker-compose.yml file is used to set up a local development environment for Odoo 19.
# It includes a PostgreSQL database and an Odoo instance with custom addons.
services:
  postgres-odoo-19:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-odoo-19-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - odoo-19-network
    restart: unless-stopped

  odoo-19:
    build: .
    depends_on:
      - postgres-odoo-19
    environment:
      - HOST=postgres-odoo-19
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8069:8069"
    volumes:
      - odoo-19-data:/var/lib/odoo
      - ./extra-addons:/mnt/extra-addons
    networks:
      - odoo-19-network
    restart: unless-stopped

volumes:
  postgres-odoo-19-data:
  odoo-19-data:

networks:
  odoo-19-network:
